[project]
name = "paper-radar"
version = "0.1.0"
description = "Hourly arXiv paper radar with LLM summaries and Telegram daily recaps."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "paperscraper>=0.2",
  "pymupdf4llm>=0.0.17",
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
]

[project.scripts]
paper-radar = "paper_radar.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["paper_radar", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
