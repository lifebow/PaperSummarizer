services:
  paper-radar:
    profiles: ["daemon"]
    build: .
    image: paper-radar:latest
    container_name: paper-radar
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./digests:/app/digests
    entrypoint: ["paper-radar"]
    command: []

  paper-radar-bot:
    build: .
    image: paper-radar:latest
    container_name: paper-radar-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: ["paper-radar"]
    command: ["serve-bot", "--poll"]

  paper-radar-web:
    build: .
    image: paper-radar:latest
    container_name: paper-radar-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    entrypoint: ["paper-radar"]
    command: ["serve-web", "--host", "0.0.0.0", "--port", "8000"]
