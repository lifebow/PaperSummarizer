services:
  paper-radar:
    profiles: ["daemon"]
    build: .
    image: paper-radar:latest
    container_name: paper-radar
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./digests:/app/digests
    entrypoint: ["paper-radar"]
    command: []

  paper-radar-bot:
    build: .
    image: paper-radar:latest
    container_name: paper-radar-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    entrypoint: ["paper-radar"]
    command: ["serve-bot", "--poll"]
