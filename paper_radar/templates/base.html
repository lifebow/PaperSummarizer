<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}PaperSummarizer{% endblock %}</title>
  <script>
    // No-flash theme init: localStorage override, else system preference.
    (function () {
      try {
        var t = localStorage.getItem("theme");
        var dark = t ? t === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
    function toggleTheme() {
      var dark = document.documentElement.classList.toggle("dark");
      try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] } } },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-white font-sans text-zinc-800 antialiased dark:bg-zinc-950 dark:text-zinc-200">
  {% block content %}{% endblock %}
</body>
</html>
